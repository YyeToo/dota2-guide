# ============================================================
# 测试专用配置
#
# 只覆盖下面这一项，其余（数据库连接、端口等）继续用 src/main/resources/application.yml。
# Spring Boot 同时加载 yml 和 properties 时，properties 的同名键优先 —— 所以这里
# 只写要改的那一个，不会连带把数据源配置也顶掉。
#
# 关掉 MyBatis 的 SQL 打印：application.yml 里开了 StdOutImpl（对新手学 SQL 很有用），
# 但集成测试要跑 127 次详情查询，每条 SQL 都连着结果集打印出来，一次就是几万行，
# 真正的测试结果会被淹掉。测试期间关掉，需要看 SQL 时把下面这行注释掉即可。
# ============================================================
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
