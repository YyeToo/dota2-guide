# ============================================================
# Spring Boot 配置文件（application.yml）
# 作用：以键值对形式配置应用，Spring Boot 启动时会自动读取本文件。
# 同名配置还有 application.properties 格式，yml 层级更清晰，二选一即可。
# ============================================================

server:
  # 后端服务端口：前端将通过 http://localhost:8080 访问
  port: 8080

spring:
  datasource:
    # JDBC 连接串（jdbc:mysql://主机:端口/数据库名?参数1&参数2...）
    # 参数逐个解释：
    #   useUnicode=true & characterEncoding=utf8 : 保证中文读写不乱码
    #   useSSL=false                           : 本地开发关闭 SSL，省去证书配置
    #   serverTimezone=Asia/Shanghai           : 时区设为东八区（新版驱动可省略，写上更保险）
    #   allowPublicKeyRetrieval=true           : MySQL 8 默认认证方式需要；不加会报
    #                                             "Public Key Retrieval is not allowed"
    url: jdbc:mysql://localhost:3306/dota_guide?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # ⚠️ 改成你自己的 MySQL 用户名和密码
    username: root
    password: 123456
    # JDBC 驱动类：Spring Boot 会根据 url 自动推断，显式写上更清晰
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  # XML 形式的 Mapper 文件去哪找。
  #
  # ⚠️ 这一行不能省。MyBatis 官方的 Spring Boot Starter **不会**默认去扫
  # src/main/resources/mapper/ —— 不配这一行，XML 文件照样会被打进 jar，
  # 但压根不会被读，接口方法找不到对应的 SQL，调用时报：
  #     Invalid bound statement (not found): com.dota.guide.mapper.HeroMapper.xxx
  # （网上常说的"默认就扫 classpath*:/mapper/**/*.xml"是 MyBatis-**Plus** 的行为，
  #   本项目用的是原版 MyBatis，没有这个默认值。）
  #
  # classpath*: 开头的星号表示"在所有 classpath 位置里找"，多个 jar 里的同名目录也能扫到；
  # ** 表示任意层级子目录，所以以后按模块分文件夹（mapper/hero/、mapper/skill/）也不用改这里。
  mapper-locations: classpath*:/mapper/**/*.xml

  configuration:
    # 下划线转驼峰：数据库列 user_name 自动映射到 Java 字段 userName
    # （本项目列名没有下划线，写上作为好习惯，避免以后踩坑）
    map-underscore-to-camel-case: true
    # 把 MyBatis 实际执行的 SQL 打印到控制台：
    # 对新手学习 SQL 和排查问题非常有帮助，上线前记得改成其他实现或删除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
