# ============================================================
# Maven Wrapper 配置：指定要下载哪个版本的 Maven
# 作用：让你【不用安装 Maven】，第一次运行 ./mvnw 时自动下载一个 Maven 到本地
# ============================================================
wrapperVersion=3.3.4
# only-script 模式：脚本直接下载 Maven 发行包，不需要额外的 wrapper jar
distributionType=only-script
# Maven 发行包下载地址：
# 官方地址是 https://repo.maven.apache.org/maven2/...，国内网络经常超时，
# 这里改用阿里云镜像（内容与官方完全一致）
distributionUrl=https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
